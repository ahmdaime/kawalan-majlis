<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kawalan Media</title>
<link rel="stylesheet" href="lib/dock.css">
<style>
  .addrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .addrow .icon-btn{padding:7px 4px;white-space:nowrap}
  .cur{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:9px}
  .cur.live{border-color:rgba(229,72,77,.7);background:linear-gradient(90deg,rgba(229,72,77,.16),var(--panel) 70%)}
  .cur .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--mute)}
  .cur .n{font-weight:700;font-size:14px;line-height:1.3;word-break:break-word}
  .thumbs{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:7px;align-items:end}
  .th{position:relative;aspect-ratio:16/9;background:#0d0e11;border-radius:5px;border:2px solid transparent;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:11px;text-align:center;padding:2px}
  .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
  .th.main{border-color:#5a5e6a}
  .th.main.live{border-color:var(--live)}
  .side{cursor:pointer;opacity:.8} .side:hover{opacity:1}
  .cap{text-align:center;font-size:10.5px;color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .strip .s{flex:0 0 92px;cursor:pointer}
  .strip .s.cur2 .th{border-color:#8d92a0}
  .strip .s.cur2.live .th{border-color:var(--live)}
  .busy{font-size:11px;color:var(--warn);min-height:15px}
  .bar{height:6px;background:#0d0e11;border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--live)}
  .time{font-size:11px;color:var(--mute);margin-top:4px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between}
  .vctl{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .vctl .b{padding:8px 6px;font-size:12px}
  .plhead{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.03em}
  .pl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:300px;background:var(--panel)}
  .it{display:grid;grid-template-columns:22px 42px 1fr auto;gap:7px;align-items:center;padding:6px 8px;border-bottom:1px solid #2a2c33;cursor:pointer;font-size:12px}
  .it:last-child{border-bottom:0}
  .it:hover{background:var(--panel2)}
  .it.on{background:#2f3340;box-shadow:inset 3px 0 0 var(--accent)}
  .it.live{background:rgba(229,72,77,.18);box-shadow:inset 3px 0 0 var(--live)}
  .it .no{color:var(--mute);font-variant-numeric:tabular-nums;text-align:right}
  .it .k{font:700 9px/1 inherit;padding:4px 0;border-radius:3px;text-align:center;letter-spacing:.04em;color:#fff}
  .k.pdf{background:#8a3b3b} .k.img{background:#2f6b54} .k.vid{background:#3b5a96}
  .it .t{min-width:0} .it .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it .t span{color:var(--mute);font-size:11px}
  .it .acts{display:flex;gap:3px}
  .it .acts button{background:var(--panel2);border:1px solid var(--line);border-radius:4px;font-size:11px;padding:2px 6px;color:var(--text)}
  .it .acts button.arm{background:var(--live);border-color:var(--live)}
  .it .acts button:disabled{opacity:.3}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="bar"></div>

<div class="addrow">
  <button class="icon-btn" id="addPdf" type="button">+ PDF / Slaid</button>
  <button class="icon-btn" id="addImg" type="button">+ Gambar</button>
  <button class="icon-btn" id="addVid" type="button">+ Video</button>
</div>
<input type="file" id="pdfInput" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="imgInput" accept="image/*" multiple hidden>
<div class="busy" id="addMsg" hidden></div>

<div id="main" hidden style="display:flex;flex-direction:column;gap:9px">
  <div class="cur" id="cur">
    <div class="top"><span class="tag" id="tag">SEDIA</span><span id="pos"></span></div>
    <div class="n" id="curName"></div>
    <!-- PDF / pictures -->
    <div id="deckView">
      <div class="thumbs">
        <div class="side" id="goPrev"><div class="th" id="tPrev"></div><div class="cap" id="capPrev">Sebelum</div></div>
        <div><div class="th main" id="tCur"></div><div class="cap" id="curCap"></div></div>
        <div class="side" id="goNext"><div class="th" id="tNext"></div><div class="cap" id="capNext">Seterusnya</div></div>
      </div>
      <div class="strip" id="strip" style="margin-top:8px"></div>
    </div>
    <!-- video -->
    <div id="vidView">
      <div class="bar"><i id="vBar"></i></div>
      <div class="time"><span id="vCur">0:00</span><span id="vDur">0:00</span></div>
      <div class="vctl" style="margin-top:8px">
        <button class="b" id="vRestart" type="button">⏮ Ulang dari awal</button>
        <button class="b" id="vPause" type="button">⏸ Jeda</button>
      </div>
    </div>
  </div>
  <div class="ctrl">
    <button class="b" id="prev" type="button">◀ Sebelum</button>
    <button class="b show" id="toggle" type="button">PAPAR</button>
    <button class="b" id="next" type="button">Seterusnya ▶</button>
  </div>
  <div class="busy" id="busy"></div>
  <div class="hint" id="hint"></div>
  <div class="plhead"><span>SUSUNAN MEDIA</span><span id="plCount"></span></div>
  <div class="pl" id="pl"></div>
</div>
<div class="empty" id="empty">Susun semua bahan majlis di sini ikut aturcara: video pembukaan, slaid (PDF), gambar.<br>Semasa majlis, tekan <b>PAPAR</b> dan <b>Seterusnya</b> sahaja.<br><br>Slaid PowerPoint atau Canva: eksport sebagai <b>PDF</b> dahulu.</div>

<script src="lib/obs.js"></script>
<script src="lib/dock.js"></script>
<script src="lib/idb.js"></script>
<script src="lib/pdf.min.js"></script>
<script src="lib/pdf.worker.min.js"></script>
<script>
(function () {
  "use strict";
  const $ = id => document.getElementById(id);
  const W = 1920, H = 1080;
  const { store, VIDEO_NAME } = KM.dock;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // Main-thread worker: real Web Workers are unreliable from file:// pages.
  pdfjsLib.GlobalWorkerOptions.workerSrc = "lib/pdf.worker.min.js";

  // Playlist: [{id, kind: "pdf"|"img"|"vid", label, count, path?}]. Files live in IndexedDB ("media:<id>").
  let items = store.get("media.items", []);
  let cur = Math.min(store.get("media.cur", 0), Math.max(0, items.length - 1));
  const page = store.get("media.page", {});        // id -> page index
  let live = false;                                // the current item is on screen
  const memFiles = new Map();                      // files that could not be stored (too big): kept for this session only
  const decks = new Map(), full = new Map(), thumb = new Map();

  const obs = KM.dock.mount($("bar"), { onConnected, events: KM.SUB.General | KM.SUB.Inputs | KM.SUB.MediaInputs });
  obs.on("custom", d => { if (d && d.app === "kawalan-majlis" && d.type === "paparan-sedia") sendSlide(); });

  const item = () => items[cur];
  const pg = it => Math.min(page[it.id] || 0, Math.max(0, (it.count || 1) - 1));
  function save() { store.set("media.items", items); store.set("media.cur", cur); store.set("media.page", page); }
  const msg = (el, t) => { $(el).textContent = t || ""; if (el === "addMsg") $(el).hidden = !t; };
  const busy = t => msg("busy", t);

  // ---------- decks (PDF / pictures), opened lazily from storage ----------
  function fitCanvas(srcW, srcH, maxW, maxH) {
    const s = Math.min(maxW / srcW, maxH / srcH);
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(srcW * s)); c.height = Math.max(1, Math.round(srcH * s));
    return { c, s };
  }
  async function fileOf(it) {
    if (memFiles.has(it.id)) return memFiles.get(it.id);
    const f = await KM.idb.get("media:" + it.id);
    if (!f) throw new Error("Fail tiada lagi dalam simpanan. Buang item ini dan tambah semula.");
    return f;
  }
  function deckOf(it) {
    if (!decks.has(it.id)) decks.set(it.id, (async () => {
      const f = await fileOf(it);
      if (it.kind === "pdf") {
        const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise;
        return { count: doc.numPages, async render(i, maxW, maxH) {
          const p = await doc.getPage(i + 1), v1 = p.getViewport({ scale: 1 });
          const { c, s } = fitCanvas(v1.width, v1.height, maxW, maxH);
          const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
          await p.render({ canvasContext: ctx, viewport: p.getViewport({ scale: s }) }).promise;
          return c.toDataURL("image/jpeg", 0.92);
        } };
      }
      const list = f;   // [{name, blob}]
      return { count: list.length, names: list.map(x => x.name), async render(i, maxW, maxH) {
        const bmp = await createImageBitmap(list[i].blob, { imageOrientation: "from-image" });
        const { c } = fitCanvas(bmp.width, bmp.height, maxW, maxH);
        const ctx = c.getContext("2d"); ctx.fillStyle = "#000"; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(bmp, 0, 0, c.width, c.height); bmp.close && bmp.close();
        return c.toDataURL("image/jpeg", 0.92);
      } };
    })().catch(e => { decks.delete(it.id); throw e; }));
    return decks.get(it.id);
  }
  function cached(map, it, i, w, h, limit) {
    const k = it.id + ":" + i;
    if (!map.has(k)) {
      map.set(k, deckOf(it).then(d => d.render(i, w, h)).catch(e => { map.delete(k); throw e; }));
      if (map.size > limit) map.delete(map.keys().next().value);
    }
    return map.get(k);
  }
  const getFull = (it, i) => cached(full, it, i, W, H, 12);
  const getThumb = (it, i) => cached(thumb, it, i, 360, 203, 400);

  // ---------- adding ----------
  const newId = () => "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  async function keep(id, data) {
    try { await KM.idb.set("media:" + id, data); return true; }
    catch (_) { memFiles.set(id, data); return false; }
  }
  function added(list, stored) {
    const wasEmpty = !items.length;
    items.push(...list); if (wasEmpty) cur = 0;
    save(); buildStrip(); render();
    msg("addMsg", stored ? "" : "Fail terlalu besar untuk disimpan: perlu ditambah semula jika OBS ditutup.");
  }
  $("addPdf").onclick = () => $("pdfInput").click();
  $("addImg").onclick = () => $("imgInput").click();
  $("pdfInput").onchange = async e => {
    const files = [...e.target.files]; e.target.value = ""; if (!files.length) return;
    msg("addMsg", "Membuka PDF…");
    const list = []; let stored = true;
    for (const f of files) {
      try {
        const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise;
        const id = newId();
        stored = (await keep(id, f)) && stored;
        list.push({ id, kind: "pdf", label: f.name, count: doc.numPages });
        doc.destroy && doc.destroy();
      } catch (err) { msg("addMsg", "Tidak dapat membuka " + f.name + ": " + err.message); return; }
    }
    added(list, stored);
  };
  // Several pictures picked together = one item, ordered by file name.
  $("imgInput").onchange = async e => {
    const files = [...e.target.files].filter(f => /^image\//.test(f.type)).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    e.target.value = ""; if (!files.length) return;
    const id = newId();
    const stored = await keep(id, files.map(f => ({ name: f.name, blob: f })));
    added([{ id, kind: "img", label: files.length === 1 ? files[0].name : files.length + " gambar (" + files[0].name + " …)", count: files.length }], stored);
  };

  // Video: a web page cannot read file paths, so OBS's own file dialog picks the file and we keep the path.
  let pickVid = null;   // {id} while the OBS dialog is open
  $("addVid").onclick = async () => {
    if (live && item() && item().kind === "vid") { msg("addMsg", "Video sedang dimainkan. Tekan SOROK dahulu, kemudian tambah video."); return; }
    msg("addMsg", "");
    try {
      await KM.dock.ensureVideo(obs);
      await obs.call("SetInputSettings", { inputName: VIDEO_NAME, inputSettings: { local_file: "" } });
      pickVid = { id: newId() };
      await obs.call("OpenInputPropertiesDialog", { inputName: VIDEO_NAME });
      msg("addMsg", "Pilih fail video dalam tetingkap OBS yang terbuka (Browse), kemudian tekan OK.");
    } catch (e) { pickVid = null; msg("addMsg", "Gagal: " + e.message); }
  };
  obs.on("event", ev => {
    const d = ev.eventData || {};
    if (d.inputName !== VIDEO_NAME) return;
    if (ev.eventType === "InputSettingsChanged" && pickVid) {
      const path = (d.inputSettings && d.inputSettings.local_file) || "";
      const at = items.findIndex(x => x.id === pickVid.id);
      if (path) {
        const label = path.split(/[\\/]/).pop();
        if (at >= 0) Object.assign(items[at], { path, label });   // changed the pick before pressing OK
        else { items.push({ id: pickVid.id, kind: "vid", label, path, count: 1 }); if (items.length === 1) cur = 0; }
        msg("addMsg", "Video ditambah: " + label);
        setTimeout(() => msg("addMsg", ""), 5000);
      } else if (at >= 0) { items.splice(at, 1); if (cur >= items.length) cur = Math.max(0, items.length - 1); }   // Cancel
      save(); render();
    }
    if (ev.eventType === "MediaInputPlaybackEnded" && live && item() && item().kind === "vid") videoEnded();
  });

  // ---------- show / hide ----------
  let sendSeq = 0;
  async function sendSlide() {
    const my = ++sendSeq, it = item();
    if (!live || !it || it.kind === "vid") { obs.broadcast({ type: "media", show: false }).catch(() => {}); return; }
    const i = pg(it);
    busy("Menyediakan " + (it.kind === "pdf" ? "halaman " : "gambar ") + (i + 1) + "…");
    try {
      const src = await getFull(it, i);
      if (my !== sendSeq) return;              // a newer action replaced this one
      await obs.broadcast({ type: "media", show: true, src, key: it.id + ":" + i });
      busy("");
    } catch (e) { if (my === sendSeq) busy("Gagal: " + e.message); }
    // Warm up the next one so the next press is instant.
    if (i + 1 < (it.count || 1)) getFull(it, i + 1).catch(() => {});
  }
  async function show() {
    const it = item(); if (!it) return;
    pickVid = null;
    if (it.kind === "vid") {
      live = true; sendSlide();                 // slides would sit above the video: clear them
      try {
        await KM.dock.ensureVideo(obs);
        await obs.call("SetInputSettings", { inputName: VIDEO_NAME, inputSettings: { local_file: it.path } });
        await KM.dock.setVideoVisible(obs, true);
        await obs.call("TriggerMediaInputAction", { inputName: VIDEO_NAME, mediaAction: "OBS_WEBSOCKET_MEDIA_INPUT_ACTION_RESTART" });
        vPaused = false; startPoll(); busy("");
      } catch (e) { live = false; busy("Gagal memainkan video: " + e.message); }
    } else { live = true; sendSlide(); }
    render();
  }
  async function hide() {
    const it = item();
    live = false;
    if (it && it.kind === "vid") await stopVideo();
    sendSlide(); render();
  }
  const toggle = () => (live ? hide() : show()).catch(e => busy("Gagal: " + e.message));

  // Moving to another item takes the screen down first: the next item goes out only when PAPAR is pressed.
  async function select(i, atEnd) {
    if (i < 0 || i >= items.length) return;
    if (i === cur) return;
    if (live) await hide();
    cur = i;
    const it = item(); if (atEnd && it.kind !== "vid") page[it.id] = (it.count || 1) - 1;
    save(); buildStrip(); render();
  }
  function go(dir) {
    const it = item(); if (!it) return;
    if (it.kind !== "vid") {
      const i = pg(it) + dir;
      if (i >= 0 && i < (it.count || 1)) { page[it.id] = i; save(); render(); if (live) sendSlide(); return; }
    }
    select(cur + dir, dir < 0).catch(e => busy("Gagal: " + e.message));
  }
  $("toggle").onclick = toggle;
  $("next").onclick = () => go(1);
  $("prev").onclick = () => go(-1);
  $("goNext").onclick = () => go(1);
  $("goPrev").onclick = () => go(-1);
  $("strip").onclick = e => {
    const el = e.target.closest("[data-i]"); const it = item(); if (!el || !it) return;
    page[it.id] = +el.dataset.i; save(); render(); if (live) sendSlide();
  };
  document.addEventListener("keydown", e => {
    if (["INPUT", "SELECT", "TEXTAREA"].includes(e.target.tagName)) return;
    if (e.key === " ") { e.preventDefault(); toggle(); }
    else if (["ArrowRight", "ArrowDown", "PageDown"].includes(e.key)) { e.preventDefault(); go(1); }
    else if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); go(-1); }
  });

  // ---------- playlist editing ----------
  let armed = null, armTimer = null;
  $("pl").onclick = async e => {
    const row = e.target.closest("[data-i]"); if (!row) return;
    const i = +row.dataset.i, act = e.target.dataset.a;
    if (!act) return select(i).catch(err => busy("Gagal: " + err.message));
    e.stopPropagation();
    if (act === "up" || act === "down") {
      const j = act === "up" ? i - 1 : i + 1; if (j < 0 || j >= items.length) return;
      const curId = item().id;
      [items[i], items[j]] = [items[j], items[i]];
      cur = items.findIndex(x => x.id === curId);
      save(); render(); return;
    }
    if (act === "del") {
      // Two presses: JS dialogs are unreliable inside OBS docks.
      if (armed !== items[i].id) { armed = items[i].id; clearTimeout(armTimer); armTimer = setTimeout(() => { armed = null; render(); }, 3000); render(); return; }
      armed = null; clearTimeout(armTimer);
      if (i === cur && live) await hide();
      const [gone] = items.splice(i, 1);
      KM.idb.del("media:" + gone.id).catch(() => {}); memFiles.delete(gone.id); decks.delete(gone.id); delete page[gone.id];
      if (i < cur || cur >= items.length) cur = Math.max(0, cur - 1);
      save(); buildStrip(); render();
    }
  };

  // ---------- video ----------
  let vPaused = false, vTimer = null;
  const fmt = ms => { const s = Math.max(0, Math.round((ms || 0) / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  function startPoll() {
    clearInterval(vTimer);
    vTimer = setInterval(async () => {
      try {
        const s = await obs.call("GetMediaInputStatus", { inputName: VIDEO_NAME });
        $("vCur").textContent = fmt(s.mediaCursor); $("vDur").textContent = fmt(s.mediaDuration);
        $("vBar").style.width = s.mediaDuration ? (100 * s.mediaCursor / s.mediaDuration) + "%" : "0";
      } catch (_) {}
    }, 500);
  }
  async function stopVideo() {
    clearInterval(vTimer); vTimer = null; vPaused = false;
    try {
      await obs.call("TriggerMediaInputAction", { inputName: VIDEO_NAME, mediaAction: "OBS_WEBSOCKET_MEDIA_INPUT_ACTION_STOP" });
      await KM.dock.setVideoVisible(obs, false);
    } catch (e) { busy("Gagal: " + e.message); }
  }
  async function videoEnded() {
    await hide();
    if (cur + 1 < items.length) {
      cur++; save(); buildStrip(); render();
      busy("Video tamat dan disorok. Seterusnya sedia: " + item().label + ". Tekan PAPAR.");
    } else busy("Video tamat dan disorok. Ini item terakhir.");
  }
  $("vRestart").onclick = async () => {
    if (!live) return show();
    await obs.call("TriggerMediaInputAction", { inputName: VIDEO_NAME, mediaAction: "OBS_WEBSOCKET_MEDIA_INPUT_ACTION_RESTART" }).catch(() => {});
    vPaused = false; render();
  };
  $("vPause").onclick = async () => {
    if (!live) return;
    vPaused = !vPaused;
    await obs.call("TriggerMediaInputAction", { inputName: VIDEO_NAME, mediaAction: vPaused ? "OBS_WEBSOCKET_MEDIA_INPUT_ACTION_PAUSE" : "OBS_WEBSOCKET_MEDIA_INPUT_ACTION_PLAY" }).catch(() => {});
    render();
  };

  async function onConnected() {
    sendSlide();
    // After a dock reload the video may still be visible from before: hide it so state matches.
    if (!live) KM.dock.setVideoVisible(obs, false).catch(() => {});
    // v1.0 kept one video in the source: bring it into the list once.
    if (!items.length && !store.get("media.migrated", false)) {
      store.set("media.migrated", true);
      try {
        const { inputSettings } = await obs.call("GetInputSettings", { inputName: VIDEO_NAME });
        const path = inputSettings.local_file;
        if (path) { items.push({ id: newId(), kind: "vid", label: path.split(/[\\/]/).pop(), path, count: 1 }); cur = 0; save(); render(); }
      } catch (_) {}
    }
  }

  // ---------- render ----------
  function setThumb(el, it, i) {
    el.textContent = "";
    if (!it || i < 0 || i >= (it.count || 1)) { el.textContent = "—"; return; }
    const want = it.id + ":" + i; el.dataset.want = want;
    getThumb(it, i).then(src => {
      if (el.dataset.want !== want) return;
      const img = new Image(); img.src = src; img.alt = "";
      el.textContent = ""; el.appendChild(img);
    }).catch(e => { if (el.dataset.want === want) el.textContent = e.message; });
  }
  // Neighbour preview: inside the item, or the first/last page of the next/previous item.
  function neighbour(dir) {
    const it = item(), i = pg(it) + dir;
    if (it.kind !== "vid" && i >= 0 && i < (it.count || 1)) return { it, i, cap: dir > 0 ? "Seterusnya" : "Sebelum" };
    const o = items[cur + dir]; if (!o) return null;
    return { it: o, i: o.kind === "vid" ? -1 : (dir > 0 ? 0 : (o.count || 1) - 1), cap: (dir > 0 ? "Item seterusnya" : "Item sebelum") };
  }
  function setSide(el, cap, n) {
    $(cap).textContent = n ? n.cap : (el === "tNext" ? "Seterusnya" : "Sebelum");
    if (!n) { $(el).textContent = "—"; $(el).dataset.want = ""; return; }
    if (n.i < 0) { $(el).textContent = "VIDEO · " + n.it.label; $(el).dataset.want = ""; return; }
    setThumb($(el), n.it, n.i);
  }
  let stripFor = null;
  function buildStrip() {
    const s = $("strip"), it = item();
    if (!it || it.kind === "vid") { s.textContent = ""; stripFor = null; return; }
    if (stripFor === it.id) return;
    stripFor = it.id; s.textContent = "";
    for (let i = 0; i < (it.count || 1); i++) {
      const el = document.createElement("div"); el.className = "s"; el.dataset.i = i;
      el.innerHTML = `<div class="th">${i + 1}</div><div class="cap">${i + 1}</div>`;
      s.appendChild(el);
    }
    // Render strip thumbnails only when scrolled into view.
    const io = new IntersectionObserver(ents => ents.forEach(en => {
      if (!en.isIntersecting) return; io.unobserve(en.target);
      setThumb(en.target.querySelector(".th"), it, +en.target.dataset.i);
    }), { root: s, rootMargin: "0px 300px" });
    s.querySelectorAll(".s").forEach(x => io.observe(x));
  }
  const KIND = { pdf: "PDF", img: "GBR", vid: "VIDEO" };
  function render() {
    const has = items.length > 0;
    $("main").hidden = !has; $("empty").hidden = has;
    if (!has) return;
    const it = item(), vid = it.kind === "vid", i = pg(it), n = it.count || 1;
    $("cur").className = "cur" + (live ? " live" : "");
    $("tag").className = "tag" + (live ? " live" : "");
    $("tag").textContent = live ? (vid ? (vPaused ? "LIVE · DIJEDA" : "LIVE · SEDANG MAIN") : "LIVE") : "SEDIA";
    $("pos").textContent = "Item " + (cur + 1) + " / " + items.length;
    $("curName").textContent = it.label;
    $("deckView").hidden = vid; $("vidView").hidden = !vid;
    if (!vid) {
      $("curCap").textContent = (it.kind === "pdf" ? "Halaman " : "Gambar ") + (i + 1) + " / " + n;
      $("tCur").classList.toggle("live", live);
      setThumb($("tCur"), it, i);
      setSide("tPrev", "capPrev", neighbour(-1)); setSide("tNext", "capNext", neighbour(1));
      $("strip").querySelectorAll(".s").forEach(el => {
        const here = +el.dataset.i === i;
        el.classList.toggle("cur2", here); el.classList.toggle("live", here && live);
        if (here) keepVisible($("strip"), el);
      });
    } else {
      $("vPause").disabled = !live; $("vPause").textContent = vPaused ? "▶ Sambung" : "⏸ Jeda";
      if (!live) { $("vBar").style.width = "0"; $("vCur").textContent = "0:00"; $("vDur").textContent = "0:00"; }
    }
    $("toggle").textContent = live ? "SOROK" : "PAPAR";
    $("toggle").className = "b " + (live ? "hide" : "show");
    const atStart = cur === 0 && (vid || i === 0), atEnd = cur === items.length - 1 && (vid || i === n - 1);
    $("prev").disabled = atStart; $("next").disabled = atEnd;
    $("hint").innerHTML = (vid
      ? "PAPAR memainkan video dari awal. Bunyi masuk ke Audio Mixer OBS sebagai \"Kawalan Majlis - Video\". Bila tamat, video disorok dan item seterusnya disediakan."
      : "Semasa LIVE, Seterusnya menukar halaman terus di skrin. Di halaman terakhir, Seterusnya menyorok dahulu dan menyediakan item berikutnya.") +
      " Pintasan: <kbd>Space</kbd> papar/sorok · <kbd>←</kbd> <kbd>→</kbd> (clicker slaid juga boleh).";
    $("plCount").textContent = items.length + " item";
    $("pl").innerHTML = items.map((x, j) => {
      const cls = j === cur ? (live ? " live" : " on") : "";
      const meta = x.kind === "vid" ? "Video" : (x.count || 1) + (x.kind === "pdf" ? " halaman" : " gambar");
      return `<div class="it${cls}" data-i="${j}"><span class="no">${j + 1}.</span><span class="k ${x.kind}">${KIND[x.kind]}</span>` +
        `<span class="t"><b>${esc(x.label)}</b><span>${meta}${memFiles.has(x.id) ? " · tidak disimpan" : ""}</span></span>` +
        `<span class="acts"><button type="button" data-a="up" title="Naik" ${j === 0 ? "disabled" : ""}>↑</button>` +
        `<button type="button" data-a="down" title="Turun" ${j === items.length - 1 ? "disabled" : ""}>↓</button>` +
        `<button type="button" data-a="del" title="Buang" class="${armed === x.id ? "arm" : ""}">${armed === x.id ? "Buang?" : "✕"}</button></span></div>`;
    }).join("");
    const onRow = $("pl").querySelector(".it.on,.it.live"); if (onRow) keepVisible($("pl"), onRow);
  }
  // Scroll only inside the box: scrollIntoView would also scroll the dock and hide the buttons.
  function keepVisible(box, el) {
    const b = box.getBoundingClientRect(), r = el.getBoundingClientRect();
    if (r.top < b.top) box.scrollTop += r.top - b.top; else if (r.bottom > b.bottom) box.scrollTop += r.bottom - b.bottom;
    if (r.left < b.left) box.scrollLeft += r.left - b.left; else if (r.right > b.right) box.scrollLeft += r.right - b.right;
  }
  buildStrip(); render();
})();
</script>
</body>
</html>
